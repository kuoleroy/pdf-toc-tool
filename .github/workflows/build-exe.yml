name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE (with OCR)
        # --noupx: GitHub runner 预装 UPX，PyInstaller 自动使用后产物损坏不可运行，必须禁用
        run: pyinstaller --onefile --windowed --noupx --collect-all rapidocr_onnxruntime --collect-all onnxruntime --name PDFTocTool pdf_toc_tool.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFTocTool-windows
          path: |
            dist/PDFTocTool.exe

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PDFTocTool.exe
